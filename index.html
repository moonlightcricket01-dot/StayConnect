<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1f2128">
  <meta name="description" content="Mindful connection manager based on psychology-backed contact spacing.">
  <link rel="manifest" href="./manifest.json">
  <title>KinCadence</title>
  <style>
    :root {
      --bg-main: #121316;
      --bg-card: #1f2128;
      --bg-input: #2a2d37;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --warning: #f59e0b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #374151;
      --radius: 12px;
      --max-width: 500px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding-bottom: 70px;
    }

    .app-container {
      width: 100%;
      max-width: var(--max-width);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }

    header span {
      color: var(--primary);
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: var(--max-width);
      background-color: var(--bg-card);
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    nav button {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    nav button.active {
      color: var(--primary);
    }

    .tab-content {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .tab-content.active {
      display: flex;
    }

    .card {
      background-color: var(--bg-card);
      border-radius: var(--radius);
      padding: 16px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .contact-name {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .contact-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 20px;
      background-color: var(--bg-input);
      color: var(--primary);
      border: 1px solid var(--border);
    }

    .action-group {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
      text-decoration: none;
    }

    .btn-primary { background-color: var(--primary); color: #fff; }
    .btn-primary:active { background-color: var(--primary-hover); }
    .btn-success { background-color: var(--success); color: #fff; }
    .btn-secondary { background-color: var(--bg-input); color: var(--text-main); border: 1px solid var(--border); }
    .btn-danger { background-color: #ef4444; color: #fff; }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg-input);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      fill: var(--text-muted);
    }

    .psych-tip {
      font-size: 0.8rem;
      color: var(--text-muted);
      background: var(--bg-input);
      padding: 10px;
      border-radius: 8px;
      border-left: 3px solid var(--primary);
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Kin<span>Cadence</span></h1>
      <span id="queue-count" class="badge">0 Calls Today</span>
    </header>

    <!-- TAB 1: TODAY'S CALL QUEUE -->
    <main id="tab-today" class="tab-content active">
      <div class="psych-tip">
        <strong>Psychology Insight:</strong> Optimal spacing prevents familiarity fatigue. Restricting touches makes your calls a pleasant surprise rather than an obligation.
      </div>
      <div id="today-container"></div>
    </main>

    <!-- TAB 2: DIRECTORY / ALL CONTACTS -->
    <main id="tab-contacts" class="tab-content">
      <div id="contacts-container"></div>
    </main>

    <!-- TAB 3: ADD NEW CONTACT -->
    <main id="tab-add" class="tab-content">
      <div class="card">
        <h2>Add Connection</h2>
        <form id="contact-form">
          <div class="form-group">
            <label for="name">Full Name *</label>
            <input type="text" id="name" required placeholder="e.g. Sarah Jenkins">
          </div>
          <div class="form-group">
            <label for="phone">Phone Number (Optional)</label>
            <input type="tel" id="phone" placeholder="+1 555-0192">
          </div>
          <div class="form-group">
            <label for="frequency">Cadence Interval (Days between calls) *</label>
            <select id="frequency" required>
              <option value="7">Every 7 days (Inner Circle / Family)</option>
              <option value="14">Every 14 days (Close Friends)</option>
              <option value="30" selected>Every 30 days (Regular Friends / Mentors)</option>
              <option value="60">Every 60 days (Extended Circle)</option>
              <option value="90">Every 90 days (Quarterly Check-in)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="notes">Memory Anchor (Optional context note)</label>
            <textarea id="notes" rows="2" placeholder="e.g. Ask about her dog's surgery or new apartment project."></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Save Connection</button>
        </form>
      </div>
    </main>
  </div>

  <nav>
    <button id="nav-today" class="active" onclick="switchTab('today')">
      <span>Today</span>
    </button>
    <button id="nav-contacts" onclick="switchTab('contacts')">
      <span>Directory</span>
    </button>
    <button id="nav-add" onclick="switchTab('add')">
      <span>+ Add</span>
    </button>
  </nav>

  <script>
    // --- 1. INDEXEDDB SETUP ---
    const DB_NAME = 'KinCadenceDB';
    const DB_VERSION = 1;
    let db = null;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = (e) => {
          db = e.target.result;
          if (!db.objectStoreNames.contains('contacts')) {
            const store = db.createObjectStore('contacts', { keyPath: 'id', autoIncrement: true });
            store.createIndex('nextCallDate', 'nextCallDate', { unique: false });
          }
        };

        request.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };

        request.onerror = (e) => reject(e.target.error);
      });
    }

    // --- 2. DB OPERATIONS ---
    function getAllContacts() {
      return new Promise((resolve) => {
        const tx = db.transaction('contacts', 'readonly');
        const store = tx.objectStore('contacts');
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result || []);
      });
    }

    function addContact(contact) {
      return new Promise((resolve) => {
        const tx = db.transaction('contacts', 'readwrite');
        const store = tx.objectStore('contacts');
        store.add(contact);
        tx.oncomplete = () => resolve();
      });
    }

    function updateContact(contact) {
      return new Promise((resolve) => {
        const tx = db.transaction('contacts', 'readwrite');
        const store = tx.objectStore('contacts');
        store.put(contact);
        tx.oncomplete = () => resolve();
      });
    }

    function deleteContact(id) {
      return new Promise((resolve) => {
        const tx = db.transaction('contacts', 'readwrite');
        const store = tx.objectStore('contacts');
        store.delete(id);
        tx.oncomplete = () => resolve();
      });
    }

    // --- 3. BUSINESS LOGIC ---
    function calculateNextCall(daysToAdd) {
      const target = new Date();
      target.setDate(target.getDate() + parseInt(daysToAdd, 10));
      target.setHours(0, 0, 0, 0);
      return target.getTime();
    }

    async function handleCallAction(contact, choice) {
      if (choice === 'done') {
        contact.lastCalled = Date.now();
        contact.nextCallDate = calculateNextCall(contact.frequency);
      } else if (choice === 'snooze') {
        contact.nextCallDate = calculateNextCall(3); // Snooze for 3 days
      }
      await updateContact(contact);
      render();
    }

    async function handleDelete(id) {
      if (confirm('Remove this connection from your cadence?')) {
        await deleteContact(id);
        render();
      }
    }

    // --- 4. RENDERERS ---
    async function render() {
      const contacts = await getAllContacts();
      renderToday(contacts);
      renderDirectory(contacts);
    }

    function renderToday(contacts) {
      const container = document.getElementById('today-container');
      const badge = document.getElementById('queue-count');
      const now = new Date();
      now.setHours(23, 59, 59, 999);
      const startOfToday = new Date().setHours(0, 0, 0, 0);

      const dueContacts = contacts.filter(c => c.nextCallDate <= now.getTime());
      badge.textContent = `${dueContacts.length} Call${dueContacts.length === 1 ? '' : 's'} Today`;

      if (dueContacts.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            <h3>All Caught Up!</h3>
            <p>You have zero pending calls today. Enjoy high respect by avoiding over-contacting.</p>
          </div>`;
        return;
      }

      container.innerHTML = dueContacts.map(c => `
        <div class="card">
          <div class="card-header">
            <div>
              <div class="contact-name">${escapeHTML(c.name)}</div>
              <div class="contact-meta">Interval: Every ${c.frequency} Days</div>
            </div>
            <span class="badge">Due Now</span>
          </div>
          ${c.notes ? `<div class="psych-tip">💡 ${escapeHTML(c.notes)}</div>` : ''}
          <div class="action-group">
            ${c.phone ? `<a href="tel:${escapeHTML(c.phone)}" class="btn btn-primary" onclick="handleCallActionById(${c.id}, 'done')">📞 Call</a>` : ''}
            <button class="btn btn-success" onclick="handleCallActionById(${c.id}, 'done')">✓ Done</button>
            <button class="btn btn-secondary" onclick="handleCallActionById(${c.id}, 'snooze')">💤 +3 Days</button>
          </div>
        </div>
      `).join('');
    }

    function renderDirectory(contacts) {
      const container = document.getElementById('contacts-container');
      if (contacts.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No Connections Added</h3>
            <p>Tap <strong>+ Add</strong> below to start pacing your relationships.</p>
          </div>`;
        return;
      }

      container.innerHTML = contacts.map(c => {
        const nextDateStr = new Date(c.nextCallDate).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        return `
          <div class="card">
            <div class="card-header">
              <div>
                <div class="contact-name">${escapeHTML(c.name)}</div>
                <div class="contact-meta">${c.phone ? escapeHTML(c.phone) + ' • ' : ''}Every ${c.frequency} Days</div>
              </div>
              <span class="badge">Next: ${nextDateStr}</span>
            </div>
            ${c.notes ? `<p style="font-size:0.85rem; color:var(--text-muted);">${escapeHTML(c.notes)}</p>` : ''}
            <div class="action-group">
              <button class="btn btn-danger" onclick="handleDelete(${c.id})">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function handleCallActionById(id, choice) {
      const contacts = await getAllContacts();
      const target = contacts.find(c => c.id === id);
      if (target) await handleCallAction(target, choice);
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // --- 5. TABS & FORM CONTROLLER ---
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));

      document.getElementById(`tab-${tabId}`).classList.add('active');
      document.getElementById(`nav-${tabId}`).classList.add('active');
    }

    document.getElementById('contact-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const frequency = parseInt(document.getElementById('frequency').value, 10);
      const notes = document.getElementById('notes').value.trim();

      const newContact = {
        name,
        phone,
        frequency,
        notes,
        created: Date.now(),
        lastCalled: null,
        nextCallDate: calculateNextCall(0) // Initial call queued for today
      };

      await addContact(newContact);
      document.getElementById('contact-form').reset();
      switchTab('today');
      render();
    });

    // Initializer
    window.addEventListener('DOMContentLoaded', async () => {
      await initDB();
      render();
    });
  </script>

  <!-- SERVICE WORKER REGISTRATION -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('KinCadence SW registered scope:', reg.scope))
          .catch(err => console.error('KinCadence SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
